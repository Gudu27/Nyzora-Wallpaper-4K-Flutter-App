// Removes legacy kotlin-android declarations from Flutter plugin build.gradle files.
// Flutter then applies KGP once at configure time, which silences the migration warning.
// See: https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin

import groovy.json.JsonSlurper

def marker = '// BUILT_IN_KOTLIN_PATCHED'

def patchBuildFile = { File buildFile ->
    if (buildFile == null || !buildFile.exists()) {
        return
    }
    def text = buildFile.getText('UTF-8')
    if (text.contains(marker) || !text.contains('kotlin-android')) {
        return
    }

    // Remove explicit KGP application only; keep kotlinOptions for JVM target.
    text = text.replaceAll(/apply plugin: ['"]kotlin-android['"]\s*\n?/, '')
    text = text.replaceAll(/\s*id\("kotlin-android"\)\s*\n?/, '')
    text = text.replaceAll(/\s*id 'kotlin-android'\s*\n?/, '')

    buildFile.setText("${marker}\n${text}", 'UTF-8')
}

def depsFile = new File(rootDir.parentFile, '.flutter-plugins-dependencies')
if (!depsFile.exists()) {
    return
}

def plugins = new JsonSlurper().parse(depsFile).plugins.android
plugins.each { plugin ->
    def androidDir = new File(plugin.path as String, 'android')
    def groovyFile = new File(androidDir, 'build.gradle')
    def ktsFile = new File(androidDir, 'build.gradle.kts')
    if (groovyFile.exists()) {
        patchBuildFile(groovyFile)
    } else if (ktsFile.exists()) {
        patchBuildFile(ktsFile)
    }
}
